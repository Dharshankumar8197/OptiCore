# ==============================================================================
# OptiCore Portable AI Server — Docker Compose Specification
# ==============================================================================

services:
  # ── OptiCore AI Vision & Inference Server ───────────────────────────────────
  server:
    image: ${OPTICORE_IMAGE:-ghcr.io/dharshankumar8197/opticore-backend}:${OPTICORE_VERSION:-latest}
    container_name: opticore-ai-server
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      # - ./models:/app/models # Optional: uncomment if you wish to override the built-in model
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - API_PORT=${API_PORT:-8000}
      - MODEL_PATH=${MODEL_PATH:-./models/best.pt}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.50}
      - IOU_THRESHOLD=${IOU_THRESHOLD:-0.45}
      - IMAGE_SIZE=${IMAGE_SIZE:-640}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-15}
      - MAX_CONCURRENT_INFERENCES=${MAX_CONCURRENT_INFERENCES:-3}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-jwt-secret-in-production-opticore}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/opticore.db}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 8s
      timeout: 5s
      retries: 5
      start_period: 12s

  # ── Official Ngrok HTTPS Tunnel (Activated with --profile ngrok) ────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: opticore-ngrok-tunnel
    restart: unless-stopped
    profiles:
      - ngrok
    command:
      - "http"
      - "server:8000"
      - "--log=stdout"
    ports:
      - "4040:4040" # Ngrok local web inspection & API dashboard
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    depends_on:
      server:
        condition: service_healthy
