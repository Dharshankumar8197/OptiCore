name: Build, Test and Release OptiCore Portable Server

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - 'portable_server/**'
      - '.github/workflows/release-portable-server.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-server

jobs:
  # ── 1. Validate Model and Python Backend ──────────────────────────────────────
  test-backend:
    name: Test Model & Inference Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: Verify YOLO26s Model & 20 Classes
        run: |
          python -c "
          from ultralytics import YOLO
          model = YOLO('backend/models/best.pt')
          print('Loaded task:', model.task)
          print('Class count:', len(model.names))
          expected_classes = [
              'person', 'car', 'bus', 'truck', 'motorcycle', 'bicycle', 'animal', 'door', 'stairs',
              'pothole', 'crack', 'manhole', 'traffic_light', 'traffic_sign', 'pole', 'tree',
              'bench', 'chair', 'waste_container', 'obstacle'
          ]
          actual_classes = list(model.names.values())
          for c in expected_classes:
              assert c in actual_classes, f'Missing expected class {c}'
          print('All 20 OptiCore classes successfully verified!')
          "

  # ── 2. Build and Publish Multi-Arch Docker Image ─────────────────────────────
  build-and-push-image:
    name: Build & Push GHCR Multi-Arch Docker Image
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 + amd64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Multi-Arch Docker Image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Package portable_server.zip and Publish Release ────────────────────────
  package-and-release:
    name: Package portable_server.zip and Publish Release
    needs: [test-backend, build-and-push-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Prepare portable_server Package and Generate Checksums
        run: |
          mkdir -p build_stage/portable_server
          cp -r portable_server/* build_stage/portable_server/

          # Update image version in template
          sed -i "s/OPTICORE_VERSION=1.0.0/OPTICORE_VERSION=${{ steps.vars.outputs.version }}/g" build_stage/portable_server/.env.example

          # Generate checksums.txt inside the folder
          cd build_stage/portable_server
          find . -type f -not -name "checksums.txt" -exec sha256sum {} + | sort -k 2 > checksums.txt
          cd ../..

          # Create portable_server.zip containing the internal folder 'portable_server'
          cd build_stage
          zip -r ../portable_server.zip portable_server
          cd ..

          # Generate archive SHA-256 checksum
          sha256sum portable_server.zip > portable_server.zip.sha256
          cat portable_server.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: OptiCore Portable AI Server v${{ steps.vars.outputs.version }}
          draft: false
          prerelease: false
          files: |
            portable_server.zip
            portable_server.zip.sha256
          body: |
            # OptiCore Portable AI Server v${{ steps.vars.outputs.version }}

            Windows-First Portable AI Inference Server powered by Docker Desktop, YOLO26s, and ngrok HTTPS tunneling.

            ### 🚀 Quick Install (Windows PowerShell)
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-portable-server.ps1 | iex
            ```

            ### 📦 Published Docker Image
            - `ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}` (Multi-Arch: `linux/amd64`, `linux/arm64`)

            ### 🧪 Verified Model
            - **YOLO26s DetectionModel** (`best.pt`) with 20 specialized mobility and obstacle classes.
